postgres:
  image: public.ecr.aws/docker/library/postgres:15-alpine
  storage: 1Gi
  dbName: tododb
  user: todouser
  password: supersecretpassword

backend:
  replicas: 2
  image:
    repository: ghcr.io/adel-716/react-fastapi-todo-backend
    tag: latest
    pullPolicy: Always
  port: 8000

frontend:
  replicas: 1
  image:
    repository: ghcr.io/adel-716/react-fastapi-todo-frontend
    tag: latest
    pullPolicy: Always
  port: 3000

ingress:
  enabled: true
  className: nginx

